
<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RetroGrafos</title><link rel="stylesheet" href="estilo.css"><script type="module" src="popup.mjs"></script></head>
<body class="popup"><main>
<header><h1>RetroGrafos</h1><button id="configurar" class="secundario">Configurar</button></header>
<p id="registro">Tags para a tarefa aberta no ServiceNow.</p>
<button id="analisar">Analisar tarefa</button>
<p id="status" role="status" aria-live="polite"></p>
<details id="detalhes" hidden><summary>Campos analisados</summary><p id="campos"></p></details>
<form id="sugestoes" hidden><fieldset><legend>Tags sugeridas</legend><div id="lista"></div></fieldset>
<button id="aplicar" type="submit" disabled>Aplicar selecionadas</button></form>
<ul id="resultado" aria-live="polite"></ul>
</main></body></html>
