<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lino — rig SVG</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="mascote-poses.css">
<style>
  :root { color-scheme: light; font-family: system-ui, "Segoe UI", sans-serif; }
  body { margin: 0; background: #eef3f1; color: #13221d; }
  header { padding: 14px 20px; background: #0b5e1f; color: #fff; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
  main { display: grid; grid-template-columns: minmax(420px, 1fr) 330px; gap: 16px; padding: 16px 20px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px #0002; padding: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 14px; }

  #stage { position: relative; height: 440px; overflow: hidden; border-radius: 10px;
    background: linear-gradient(#f7faf9 0 72%, #dfe7e4 72% 100%); }
  #actor { position: absolute; bottom: 14px; left: calc(50% - 144px); width: 288px; height: 360px; }
  #actor.travel { transition: left 2.4s linear; }
  #actor svg { width: 100%; height: 100%; display: block; }
  #bubble { position: absolute; max-width: 220px; padding: 9px 12px; border-radius: 14px; background: #fff;
    border: 2px solid #0b5e1f; font-size: 14px; box-shadow: 0 2px 6px #0002; opacity: 0;
    transform: translate(0, -100%) scale(.9); transform-origin: 0 100%; transition: opacity .2s, transform .2s; pointer-events: none; }
  #bubble.show { opacity: 1; transform: translate(0, -100%) scale(1); }
  #bubble::after { content: ""; position: absolute; left: 10px; bottom: -9px; width: 14px; height: 14px; background: #fff;
    border: 2px solid #0b5e1f; border-top: 0; border-left: 0; transform: rotate(45deg) skew(10deg, 10deg); }

  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .controls button { border: 1px solid #1f8927; background: #fff; color: #0b5e1f; padding: 6px 10px; border-radius: 8px; cursor: pointer; font: inherit; font-size: 13px; }
  .controls button[aria-pressed=true] { background: #1f8927; color: #fff; }
  label { font-size: 12px; display: grid; gap: 2px; }
  select { font: inherit; font-size: 13px; padding: 3px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .minis { display: flex; align-items: flex-end; gap: 18px; padding: 8px 4px; background: #f4f7f6; border-radius: 8px;
    background-image: repeating-linear-gradient(0deg, #0001 0 1px, transparent 1px 16px); }
  .mini { display: grid; justify-items: center; font-size: 11px; color: #4a5c56; gap: 2px; }
  .mini svg { display: block; }
  .mini.h96 svg { height: 96px; width: 76.8px; }
  .mini.h64 svg { height: 64px; width: 51.2px; }
  .mini.h120 svg { height: 120px; width: 96px; }
  .ref img { width: 100%; border-radius: 8px; display: block; }

  #sheet { grid-column: 1 / -1; }
  #sheet .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  #sheet figure { margin: 0; background: #f4f7f6; border-radius: 8px; padding: 6px; text-align: center; font-size: 12px; }
  #sheet svg { height: 170px; width: 136px; }
  .m-static, .m-static * { animation: none !important; transition: none !important; }
  .themed { --mascot-green: #1d5fbf; --mascot-green-dark: #0d3a7a; --mascot-green-light: #4d8ff0; --mascot-lime: #7cd3ff; }
</style>
</head>
<body>
<header>
  <h1>Lino — rig vetorial (SVG)</h1>
  <p>Partes em grupos com pivôs; poses e loops por atributos/classes CSS. Respeita <code>prefers-reduced-motion</code>.</p>
</header>

      <button data-act="neutral">Idle</button>
      <button data-act="wave">Acenar</button>
      <button data-act="think">Pensando</button>
      <button data-act="confused">Confuso</button>
      <button data-act="jump">Feliz pulando</button>
      <button data-act="point">Apontando</button>
      <button data-act="walk">Andar</button>
      <button data-act="talk">Falar</button>
    </div>

<g id="m-clipboard" class="m-alt m-st"><rect x="62" y="124" width="52" height="40" rx="5" class="w"/><rect x="78" y="120" width="20" height="8" rx="2" class="k"/></g>
<g id="m-sleep-mark" class="m-alt" fill="none" stroke="var(--_ws)" stroke-width="3"><path d="M138 16h12l-12 12h12"/></g>
</svg>
<!--MASCOTE:FIM-->
      </div>
      <div id="bubble" role="status" aria-live="polite"></div>
    </div>
  </section>

  <aside style="display:grid;gap:12px;align-content:start">
    <section class="card">
      <h2>Expressão manual</h2>
      <div class="grid2">
        <label>Olhos <select data-attr="data-eyes"><option>normal</option><option>closed</option><option>happy</option><option>worried</option></select></label>
        <label>Boca <select data-attr="data-mouth"><option>smile</option><option>happy</option><option>neutral</option><option>serious</option><option>talk-a</option><option>talk-o</option></select></label>
        <label>Mão esq. (tela) <select data-attr="data-hand-l"><option>relaxed</option><option>open-wave</option><option>pointing</option><option>thinking</option></select></label>
        <label>Mão dir. (tela) <select data-attr="data-hand-r"><option>relaxed</option><option>open-wave</option><option>pointing</option><option>thinking</option></select></label>
        <label><span><input type="checkbox" id="blink" checked> piscar</span></label>
        <label><span><input type="checkbox" id="theme"> tema alternativo</span></label>
      </div>
    </section>
    <section class="card">
      <h2>Legibilidade em tamanho real</h2>
      <div class="minis">
        <div class="mini h64" id="mini64"><span>64 px</span></div>
        <div class="mini h96" id="mini96"><span>96 px</span></div>
        <div class="mini h120" id="mini120"><span>120 px</span></div>
      </div>
    </section>
    <section class="card ref">
      <h2>Referência (render 3D)</h2>
      <img id="refimg" alt="Referência do mascote" src="../../../docs/mascote-referencia/03-acenando-frame-video-0s05.png">
    </section>
  </aside>

  <section class="card" id="sheet">
    <h2>Folha de poses (estático)</h2>
    <div class="row" id="sheetRow"></div>
  </section>
</main>

<script>
(() => {
  const POSES = {
    neutral:  { pose: "neutral",  eyes: "normal",  mouth: "smile",   hl: "relaxed",   hr: "relaxed",   props: "",     ref: "03-acenando-frame-video-0s05.png" },
    wave:     { pose: "wave",     eyes: "normal",  mouth: "happy",   hl: "open-wave", hr: "relaxed",   props: "",     ref: "03-acenando-frame-video-0s05.png" },
    think:    { pose: "think",    eyes: "normal",  mouth: "serious", hl: "thinking",  hr: "relaxed",   props: "",     ref: "04-pensativo-frame-video-0s05.png" },
    confused: { pose: "confused", eyes: "worried", mouth: "serious", hl: "thinking",  hr: "relaxed",   props: "bulb", ref: "05-confuso-lampada-frame-video-0s05.png" },
    jump:     { pose: "jump",     eyes: "normal",  mouth: "happy",   hl: "open-wave", hr: "open-wave", props: "",     ref: "01-robo-happy-comemorando.png" },
    point:    { pose: "point",    eyes: "normal",  mouth: "smile",   hl: "relaxed",   hr: "pointing",  props: "",     ref: "03-acenando-frame-video-0s05.png" },
  };
  const FALAS = {
    entrada: "Olá! Sou o assistente da L&CO. Vou analisar este incidente.",
    talk: "Encontrei 3 incidentes parecidos nos últimos 30 dias.",
    think: "Hmm… deixa eu cruzar com o histórico.",
    confused: "Não achei um padrão claro. Pode revisar a categoria?",
    jump: "Pronto! Classificação concluída.",
    point: "Olha aqui: este campo está vazio.",
  };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const actor = document.getElementById("actor");
  const stage = document.getElementById("stage");
  const bubble = document.getElementById("bubble");
  const main = actor.querySelector("svg.mascote");
  const all = [main];

  for (const id of ["mini64", "mini96", "mini120"]) {
    const c = main.cloneNode(true);
    document.getElementById(id).prepend(c);
    all.push(c);
  }

  function apply(svg, p) {
    svg.setAttribute("data-pose", p.pose);
    svg.setAttribute("data-eyes", p.eyes);
    svg.setAttribute("data-mouth", p.mouth);
    svg.setAttribute("data-hand-l", p.hl);
    svg.setAttribute("data-hand-r", p.hr);
    svg.setAttribute("data-props", p.props);
  }
  const setAll = (fn) => all.forEach(fn);

  function setPose(name) {
    const p = POSES[name];
    setAll((s) => apply(s, p));
    document.getElementById("refimg").src = "../../../docs/mascote-referencia/" + p.ref;
    syncSelects();
  }
  function syncSelects() {
    document.querySelectorAll("select[data-attr]").forEach((s) => (s.value = main.getAttribute(s.dataset.attr)));
  }
  function setLoop(cls, on) { setAll((s) => s.classList.toggle(cls, on)); }

  let talkTimer = 0, bubbleTimer = 0, walkTimer = 0;
  function say(text, ms = 3200) {
    clearTimeout(bubbleTimer);
    placeBubble();
    bubble.textContent = text;
    bubble.classList.add("show");
    startTalk();
    bubbleTimer = setTimeout(() => { bubble.classList.remove("show"); stopTalk(); }, ms);
  }
  function placeBubble() {
    const a = main.querySelector("#m-speech-anchor circle");
    const m = a.getScreenCTM();
    const pt = new DOMPoint(+a.getAttribute("cx"), +a.getAttribute("cy")).matrixTransform(m);
    const r = stage.getBoundingClientRect();
    bubble.style.left = Math.min(pt.x - r.left, r.width - 230) + "px";
    bubble.style.top = Math.max(pt.y - r.top, 70) + "px";
  }
  function startTalk() {
    stopTalk();
    setLoop("is-talking", true);
    const rest = main.getAttribute("data-mouth");
    if (reduce.matches) { setAll((s) => s.setAttribute("data-mouth", "talk-a")); talkTimer = -1; talkRest = rest; return; }
    const seq = ["talk-a", "talk-o", "smile", "talk-a", "neutral", "talk-o"];
    let i = 0;
    talkRest = rest;
    talkTimer = setInterval(() => setAll((s) => s.setAttribute("data-mouth", seq[i++ % seq.length])), 120);
  }
  let talkRest = "smile";
  function stopTalk() {
    if (!talkTimer) return;
    if (talkTimer > 0) clearInterval(talkTimer);
    talkTimer = 0;
    setLoop("is-talking", false);
    setAll((s) => s.setAttribute("data-mouth", talkRest));
  }

  function walkTo(leftPx, done) {
    if (reduce.matches) { actor.style.left = leftPx + "px"; done && done(); return; }
    setLoop("is-walking", true);
    actor.getBoundingClientRect();
    actor.classList.add("travel");
    actor.style.left = leftPx + "px";
    clearTimeout(walkTimer);
    walkTimer = setTimeout(() => { setLoop("is-walking", false); actor.classList.remove("travel"); done && done(); }, 2400);
  }
  const center = () => stage.clientWidth / 2 - actor.offsetWidth / 2;

  function act(name) {
    document.querySelectorAll("#poses button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.act === name));
    stopTalk(); bubble.classList.remove("show");
    if (name === "entrada") {
      setPose("neutral");
      actor.classList.remove("travel");
      actor.style.left = -actor.offsetWidth + "px";
      actor.getBoundingClientRect();
      walkTo(center(), () => { setPose("wave"); say(FALAS.entrada, 3600); setTimeout(() => setPose("neutral"), 3800); });
      return;
    }
    if (name === "walk") {
      setPose("neutral");
      const w = stage.clientWidth - actor.offsetWidth;
      const go = (toRight) => walkTo(toRight ? w - 10 : 10, () => main.classList.contains("is-walking") || walkLoop && go(!toRight));
      walkLoop = true; go(true);
      return;
    }
    walkLoop = false;
    if (name === "talk") { setPose("neutral"); say(FALAS.talk, 3500); return; }
    setPose(name);
    if (FALAS[name]) say(FALAS[name], 3000);
  }
  let walkLoop = false;

  document.getElementById("poses").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.act !== "walk") walkLoop = false;
    act(b.dataset.act);
  });
  document.querySelectorAll("select[data-attr]").forEach((s) =>
    s.addEventListener("change", () => setAll((svg) => svg.setAttribute(s.dataset.attr, s.value))));
  document.getElementById("blink").addEventListener("change", (e) => setLoop("is-blinking", e.target.checked));
  document.getElementById("theme").addEventListener("change", (e) => document.body.classList.toggle("themed", e.target.checked));

  const sheet = [
    ["neutral", "idle / neutro"], ["wave", "acenar"], ["think", "pensando"], ["confused", "confuso + lâmpada"],
    ["jump", "feliz (braços abertos)"], ["point", "apontando"],
    [{ ...POSES.neutral, eyes: "happy", mouth: "happy" }, "olhos happy"],
    [{ ...POSES.neutral, eyes: "closed", mouth: "neutral" }, "olhos fechados"],
    [{ ...POSES.neutral, mouth: "talk-a" }, "fala A"],
    [{ ...POSES.neutral, mouth: "talk-o" }, "fala O"],
  ];
  const row = document.getElementById("sheetRow");
  for (const [p, label] of sheet) {
    const f = document.createElement("figure");
    const c = main.cloneNode(true);
    c.classList.add("m-static");
    apply(c, typeof p === "string" ? POSES[p] : p);
    f.append(c, Object.assign(document.createElement("figcaption"), { textContent: label }));
    row.append(f);
  }

  setLoop("is-idle", true);
  setLoop("is-blinking", true);
  const q = new URLSearchParams(location.search);
  if (q.get("pose") && POSES[q.get("pose")]) setPose(q.get("pose")); else setPose("neutral");
  if (q.has("static")) setAll((s) => s.classList.add("m-static"));
  if (q.get("act")) act(q.get("act"));
})();
</script>
</body>
</html>
