.mascote[data-hand-l=open-wave] #m-hand-l .m-hand-open-wave,.mascote[data-hand-l=open-up] #m-hand-l .m-hand-open-wave,.mascote[data-hand-l=relaxed] #m-hand-l .m-hand-relaxed,.mascote[data-hand-l=holding] #m-hand-l .m-hand-relaxed,.mascote[data-hand-l=pointing] #m-hand-l .m-hand-pointing,.mascote[data-hand-l=thinking] #m-hand-l .m-hand-thinking,
